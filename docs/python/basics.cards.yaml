- id: python-basics-list-definition
  tier: core
  type: recall
  q: What is a Python list and is it mutable?
  a: An ordered collection defined with []. Yes, it is mutable — you can append, remove, and modify elements after creation.
  tags: [python, data-types, fundamentals]
  verified: 2026-07-29

- id: python-basics-tuple-definition
  tier: core
  type: recall
  q: What is a Python tuple and is it mutable?
  a: An ordered collection defined with (). No, it is immutable — cannot be modified after creation.
  tags: [python, data-types, fundamentals]
  verified: 2026-07-29

- id: python-basics-list-vs-tuple
  tier: core
  type: elaborative
  q: When would you choose a tuple over a list?
  a: When the data should not change (coordinates, config values, dict keys). Tuples are also faster and use less memory.
  why: Tuples can be dictionary keys because they are hashable. Lists cannot, because mutability means their hash could change.
  tags: [python, data-types]
  verified: 2026-07-29
  sources:
    - title: Python Docs — Lists
      url: https://docs.python.org/3/tutorial/datastructures.html#more-on-lists
    - title: Python Docs — Tuples
      url: https://docs.python.org/3/tutorial/datastructures.html#tuples-and-sequences

- id: python-basics-args-purpose
  tier: core
  type: recall
  q: What does *args do in a Python function definition?
  a: Collects any number of extra positional arguments into a tuple.
  tags: [python, functions]
  verified: 2026-07-29

- id: python-basics-kwargs-purpose
  tier: core
  type: recall
  q: What does **kwargs do in a Python function definition?
  a: Collects any number of extra keyword arguments into a dictionary.
  tags: [python, functions]
  verified: 2026-07-29

- id: python-basics-args-kwargs-order
  tier: core
  type: recall
  q: In what order must parameters appear in a Python function signature?
  a: regular params, *args, keyword-only params, **kwargs
  tags: [python, functions]
  verified: 2026-07-29

- id: python-basics-args-naming
  tier: deep
  type: recall
  q: Are the names "args" and "kwargs" required in Python?
  a: No, they are convention. *x and **y work the same — the * and ** are what matter.
  tags: [python, functions]
  verified: 2026-07-29

- id: python-basics-venv-purpose
  tier: core
  type: concept
  q: What is a Python virtual environment and why use one?
  a: An isolated Python environment with its own packages, independent of the system Python. Prevents dependency conflicts between projects.
  tags: [python, venv, fundamentals]
  verified: 2026-07-29
  sources:
    - title: Python Docs — Virtual Environments
      url: https://docs.python.org/3/tutorial/venv.html

- id: python-basics-venv-create
  tier: core
  type: command
  q: How do you create a virtual environment in Python?
  a: python -m venv myenv
  tags: [python, venv, commands]
  verified: 2026-07-29

- id: python-basics-venv-activate
  tier: core
  type: command
  q: How do you activate a virtual environment on Linux/Mac?
  a: source myenv/bin/activate
  tags: [python, venv, commands]
  verified: 2026-07-29

- id: python-basics-pip-freeze
  tier: core
  type: command
  q: How do you export all installed packages in a Python environment?
  a: pip freeze > requirements.txt
  tags: [python, venv, commands]
  verified: 2026-07-29

- id: python-basics-pip-install-reqs
  tier: core
  type: command
  q: How do you install packages from a requirements file?
  a: pip install -r requirements.txt
  tags: [python, venv, commands]
  verified: 2026-07-29

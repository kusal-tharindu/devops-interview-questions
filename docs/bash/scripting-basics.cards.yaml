- id: bash-scripting-shebang-purpose
  tier: core
  type: concept
  q: What is the shebang line and what does it do?
  a: The first line of a script (e.g., #!/bin/bash) that tells the kernel which interpreter to use to execute the file.
  tags: [bash, scripting, fundamentals]
  verified: 2026-07-29
  sources:
    - title: GNU Bash Manual
      url: https://www.gnu.org/software/bash/manual/bash.html

- id: bash-scripting-bash-vs-sh
  tier: core
  type: recall
  q: What is the difference between #!/bin/bash and #!/bin/sh?
  a: /bin/bash uses Bash with extra features (arrays, [[ ]]). /bin/sh uses the system POSIX shell — more portable but fewer features.
  why: On Ubuntu, /bin/sh is symlinked to dash (not bash), so Bash-specific syntax will fail under #!/bin/sh.
  tags: [bash, scripting, fundamentals]
  verified: 2026-07-29

- id: bash-scripting-command-sub-modern
  tier: core
  type: recall
  q: What is the preferred way to do command substitution in Bash?
  a: $(command) — it is nestable and readable. Backticks are the older form and harder to nest.
  tags: [bash, scripting, expansion]
  verified: 2026-07-29

- id: bash-scripting-variable-expansion
  tier: core
  type: recall
  q: What does ${variable} do in Bash?
  a: Variable expansion — references the value of a variable, with optional manipulation like defaults or string trimming.
  tags: [bash, scripting, expansion]
  verified: 2026-07-29

- id: bash-scripting-default-value
  tier: deep
  type: command
  q: How do you provide a default value if a variable is unset in Bash?
  a: ${var:-default} — uses "default" if var is unset or empty.
  tags: [bash, scripting, expansion]
  verified: 2026-07-29

- id: bash-scripting-string-length
  tier: deep
  type: command
  q: How do you get the length of a variable's value in Bash?
  a: ${#var}
  tags: [bash, scripting, expansion]
  verified: 2026-07-29

- id: bash-scripting-set-e
  tier: core
  type: recall
  q: What does set -e do in a Bash script?
  a: Exit immediately if any command returns a non-zero exit code.
  tags: [bash, scripting, error-handling]
  verified: 2026-07-29

- id: bash-scripting-set-u
  tier: core
  type: recall
  q: What does set -u do in a Bash script?
  a: Treat references to unset variables as errors (script exits).
  tags: [bash, scripting, error-handling]
  verified: 2026-07-29

- id: bash-scripting-pipefail
  tier: core
  type: recall
  q: What does set -o pipefail do?
  a: A pipeline fails if ANY command in it fails — not just the last one.
  why: Without pipefail, a failing command piped to grep would exit 0 if grep succeeds, hiding the failure.
  tags: [bash, scripting, error-handling]
  verified: 2026-07-29

- id: bash-scripting-safe-combo
  tier: core
  type: command
  q: What is the common safety preamble at the top of production Bash scripts?
  a: set -euo pipefail
  tags: [bash, scripting, error-handling]
  verified: 2026-07-29

- id: bash-scripting-trap-cleanup
  tier: deep
  type: command
  q: How do you run cleanup code when a Bash script exits (even on error)?
  a: trap cleanup_function EXIT
  why: This ensures temp files, locks, or connections are cleaned up regardless of how the script exits.
  tags: [bash, scripting, error-handling]
  verified: 2026-07-29

- id: bash-scripting-allow-failure
  tier: deep
  type: command
  q: How do you allow a specific command to fail without triggering set -e?
  a: Append || true to the command.
  tags: [bash, scripting, error-handling]
  verified: 2026-07-29
  sources:
    - title: GNU Bash — The Set Builtin
      url: https://www.gnu.org/software/bash/manual/bash.html#The-Set-Builtin

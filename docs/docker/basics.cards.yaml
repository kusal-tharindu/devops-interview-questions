- id: docker-basics-image-definition
  tier: core
  type: concept
  q: What is a Docker image?
  a: A read-only template containing application code, runtime, libraries, and dependencies — built from a Dockerfile.
  tags: [docker, images, fundamentals]
  verified: 2026-07-29
  sources:
    - title: Docker Docs — Images
      url: https://docs.docker.com/get-started/overview/#images

- id: docker-basics-container-definition
  tier: core
  type: concept
  q: What is a Docker container?
  a: A running instance of an image — it adds a writable layer on top. Ephemeral by default (data lost when removed).
  tags: [docker, containers, fundamentals]
  verified: 2026-07-29

- id: docker-basics-image-vs-container
  tier: core
  type: recall
  q: What is the relationship between a Docker image and a container?
  a: An image is a blueprint (read-only). A container is a running instance of that image (writable layer added). One image can spawn many containers.
  tags: [docker, images, containers]
  verified: 2026-07-29

- id: docker-basics-dockerfile-purpose
  tier: core
  type: concept
  q: What is a Dockerfile?
  a: A text file with instructions to build a Docker image. Each instruction creates a layer. Docker executes them top-to-bottom.
  tags: [docker, dockerfile]
  verified: 2026-07-29
  sources:
    - title: Docker Docs — Dockerfile Reference
      url: https://docs.docker.com/reference/dockerfile/

- id: docker-basics-from-instruction
  tier: core
  type: recall
  q: What does the FROM instruction do in a Dockerfile?
  a: Sets the base image to build on top of. Every Dockerfile must start with FROM.
  tags: [docker, dockerfile]
  verified: 2026-07-29

- id: docker-basics-run-instruction
  tier: core
  type: recall
  q: What does the RUN instruction do in a Dockerfile?
  a: Executes a command during the image build (e.g., installing packages). Each RUN creates a new layer.
  tags: [docker, dockerfile]
  verified: 2026-07-29

- id: docker-basics-copy-vs-add
  tier: deep
  type: recall
  q: What is the difference between COPY and ADD in a Dockerfile?
  a: COPY simply copies files from host to image. ADD can also extract tar archives and fetch URLs — prefer COPY for clarity.
  tags: [docker, dockerfile]
  verified: 2026-07-29

- id: docker-basics-cmd-purpose
  tier: core
  type: recall
  q: What does CMD do in a Dockerfile?
  a: Sets the default command to run when a container starts. Easily overridden at runtime with docker run image new-command.
  tags: [docker, dockerfile]
  verified: 2026-07-29

- id: docker-basics-entrypoint-purpose
  tier: core
  type: recall
  q: What does ENTRYPOINT do in a Dockerfile?
  a: Sets the main executable that always runs. Not overridden unless you use the --entrypoint flag.
  tags: [docker, dockerfile]
  verified: 2026-07-29

- id: docker-basics-cmd-vs-entrypoint
  tier: core
  type: elaborative
  q: When would you use ENTRYPOINT + CMD together?
  a: ENTRYPOINT for the binary, CMD for default arguments. Users can override just the arguments without changing the executable.
  why: "Example: ENTRYPOINT [\"python\"] + CMD [\"app.py\"] — user can override just the script at runtime."
  tags: [docker, dockerfile]
  verified: 2026-07-29

- id: docker-basics-expose-instruction
  tier: deep
  type: recall
  q: What does EXPOSE do in a Dockerfile?
  a: Documents which port the container listens on. It does NOT publish the port — you still need -p at runtime.
  tags: [docker, dockerfile]
  verified: 2026-07-29

- id: docker-basics-layer-caching
  tier: deep
  type: elaborative
  q: Why does instruction order matter in a Dockerfile?
  a: Docker caches layers. If an early layer changes, all subsequent layers rebuild. Put frequently-changing instructions (like COPY . .) last for faster builds.
  tags: [docker, dockerfile, performance]
  verified: 2026-07-29

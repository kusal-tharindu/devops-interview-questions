- id: linux-fs-fhs-purpose
  tier: core
  type: concept
  q: What problem does the Filesystem Hierarchy Standard solve?
  a: It standardises where files live so software and admins can predict paths across distributions.
  why: Without it every distro would place config and binaries differently and nothing would be portable.
  tags: [linux, filesystem, fundamentals]
  verified: 2026-07-29
  ref: '#fhs'
  sources:
    - title: Filesystem Hierarchy Standard 3.0
      url: https://refspecs.linuxfoundation.org/FHS_3.0/fhs-3.0.html

- id: linux-fs-etc-purpose
  tier: core
  type: recall
  q: What does /etc hold?
  a: System-wide configuration files.
  tags: [linux, filesystem]
  verified: 2026-07-29
  ref: '#fhs'

- id: linux-fs-var-purpose
  tier: core
  type: recall
  q: What does /var hold?
  a: Variable data — logs, caches and spool files.
  tags: [linux, filesystem]
  verified: 2026-07-29
  ref: '#fhs'

- id: linux-fs-tmp-purpose
  tier: core
  type: recall
  q: What does /tmp hold and what happens to it on reboot?
  a: Temporary files, typically cleared on reboot.
  tags: [linux, filesystem]
  verified: 2026-07-29
  ref: '#fhs'

- id: linux-fs-proc-purpose
  tier: deep
  type: recall
  q: What is /proc and is it stored on disk?
  a: A virtual filesystem exposing kernel and process state. Not on disk — generated by the kernel on demand.
  tags: [linux, filesystem]
  verified: 2026-07-29
  ref: '#fhs'

- id: linux-fs-bin-vs-usrbin
  tier: deep
  type: elaborative
  q: Why did /bin and /usr/bin historically exist separately?
  a: /bin held binaries needed to boot single-user mode, when /usr might be on a separate or network partition.
  why: Modern distros symlink /bin to /usr/bin because that constraint no longer applies.
  tags: [linux, filesystem, history]
  verified: 2026-07-29
  ref: '#fhs'

- id: linux-fs-inode-definition
  tier: core
  type: concept
  q: What is an inode?
  a: The structure holding a file's metadata — permissions, owner, size, timestamps and block pointers.
  tags: [linux, filesystem, inodes]
  verified: 2026-07-29
  ref: '#inodes'
  sources:
    - title: man 7 inode
      url: https://man7.org/linux/man-pages/man7/inode.7.html

- id: linux-fs-inode-not-stored
  tier: core
  type: recall
  q: What two things does an inode NOT store?
  a: The filename and the file contents.
  why: Names live in directory entries that map name to inode number. That separation is why hard links work.
  tags: [linux, filesystem, inodes]
  verified: 2026-07-29
  ref: '#inodes'

- id: linux-fs-inode-view-command
  tier: core
  type: command
  q: How do you view the inode number of a file?
  a: ls -i filename
  tags: [linux, filesystem, inodes, commands]
  verified: 2026-07-29
  ref: '#inodes'

- id: linux-fs-symlink-vs-hardlink
  tier: core
  type: recall
  q: What is the key difference between a hard link and a symbolic link?
  a: A hard link shares the target's inode. A symlink has its own inode containing a path to the target.
  tags: [linux, filesystem, inodes]
  verified: 2026-07-29
  ref: '#links'

- id: linux-fs-hardlink-link-count
  tier: deep
  type: elaborative
  q: When is a file's data actually freed?
  a: When its inode link count reaches zero and no process still holds it open.
  why: This is why deleting a file a running process has open frees no space until that process exits.
  tags: [linux, filesystem, inodes]
  verified: 2026-07-29
  ref: '#links'

- id: linux-fs-hardlink-limits
  tier: deep
  type: recall
  q: What are two things a hard link cannot do that a symlink can?
  a: Cross filesystems, and point at a directory.
  tags: [linux, filesystem, inodes]
  verified: 2026-07-29
  ref: '#links'

- id: linux-fs-inode-exhaustion
  tier: core
  type: scenario
  q: Writes fail with "No space left on device" but df -h shows free space. What do you check?
  a: Inode exhaustion — run df -i. Every file consumes an inode regardless of size.
  tags: [linux, filesystem, troubleshooting]
  verified: 2026-07-29
  ref: '#inode-exhaustion'
